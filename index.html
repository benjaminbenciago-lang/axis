<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axis Read and Earn</title>
<style>
:root{--bg:#0f1419;--card:#1a2129;--card2:#242f3a;--line:#2a333d;--blue:#1a8cff;--gold:#ffb400;--green:#00e676;--red:#ff6b6b;--text:#e6e6e6;--muted:#8b98a5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
a{color:var(--blue);cursor:pointer}
.muted{color:var(--muted)}
.pad{padding:14px}
.top{background:#151a20;padding:calc(12px + env(safe-area-inset-top,0px)) 15px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.5px}
.brand b{color:#00ff88}
.who{font-size:13px;color:var(--muted);cursor:pointer;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);margin:10px;border-radius:12px;padding:14px;border:1px solid var(--line)}
.card h3{margin:0 0 6px}
.btn{padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;font-size:14px}
.btn:disabled{opacity:.5}
.btn-blue{background:var(--blue);color:#fff}.btn-gold{background:var(--gold);color:#000}.btn-dark{background:var(--card2);color:#fff}.btn-red{background:#3a2226;color:var(--red)}
.two{display:flex;gap:8px}.two .btn{flex:1}
input,textarea,select{width:100%;padding:11px;background:var(--card2);border:1px solid #333d48;color:#fff;border-radius:8px;margin-top:8px;font-size:15px;font-family:inherit}
textarea{min-height:220px;resize:vertical}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover{width:60px;height:85px;border-radius:8px;object-fit:cover;background:var(--card2);flex:none}
.coverBig{width:110px;height:156px;border-radius:12px;object-fit:cover;background:var(--card2);border:2px solid var(--blue);flex:none}
.ph{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--blue)}
.sqlbox{background:#0c0e12;padding:10px;border-radius:8px;font-size:11px;overflow:auto;max-height:260px;white-space:pre;margin:8px 0 0}
.steps{padding-left:20px;line-height:1.7;font-size:14px;margin:8px 0 0}
.badge{background:var(--card2);padding:3px 8px;border-radius:20px;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 12px;border-radius:20px;background:var(--card2);border:1px solid #333d48;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hero{display:flex;gap:14px;align-items:flex-start}
.hero h2{margin:0 0 4px}
#reader{position:fixed;inset:0;background:#0c0e12;z-index:300;display:none;overflow-y:auto}
.readerTop{position:sticky;top:0;background:#0c0e12;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:2}
.readerTop span{cursor:pointer;font-size:14px}
.readerContent{padding:20px 20px 60px;max-width:760px;margin:auto}
.readerContent .body{line-height:1.9;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:99}
.navItem{text-align:center;font-size:11px;cursor:pointer;opacity:.65;flex:1}
.navItem.active{opacity:1;color:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

</div>

  </div>

<div id="page-library" style="display:none"><div id="libraryBody"></div></div>

  <div id="writeGate"></div>

    <div class="card">
      <b>Your books</b>
      <div class="chips" id="myBookChips"></div>

    <div class="card">
      <b id="bookFormTitle">New book</b>
      <div style="display:flex;gap:12px;align-items:flex-start;margin-top:10px">

      <input id="chTitle" placeholder="Chapter title" maxlength="150">

      <div class="two">
        <button class="btn btn-blue" id="chPublish" onclick="publishChapter()">Publish chapter</button>
        <button class="btn btn-dark" onclick="nextChapter()">Next chapter</button>
      </div>

    <div class="card" id="chapterListCard" style="display:none">

    </div>

<!-- ME -->

<!-- READER -->
<div id="reader">

    <span onclick="closeReader()">← Back</span>

  <div class="readerContent">
    <div id="rBook" style="display:flex;gap:12px;align-items:center;margin-bottom:18px"></div>
    <h2 id="rTitle" style="margin:0 0 16px"></h2>

    <div class="two" style="margin-top:30px">

    <div id="commentsBox" style="margin-top:28px">

      <div class="two" style="align-items:stretch">

    </div>

</div>

<div class="bottomNav">
  <div class="navItem active" id="n-explore" onclick="showPage('explore')">🔍<br>Explore</div>
  <div class="navItem" id="n-library" onclick="showPage('library')">📚<br>Library</div>
  <div class="navItem" id="n-write" onclick="showPage('write')">✍️<br>Write</div>
  <div class="navItem" id="n-me" onclick="showPage('me')">👤<br>Me</div>
</div>

<div id="toast"></div>

<script type="text/plain" id="sqlText">
-- AXIS NOVEL - Supabase setup (run once on a fresh project)

-- ============ TABLES ============

create table public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  display_name text not null default 'Reader' check (char_length(display_name) between 1 and 40),
  created_at timestamptz not null default now()
);

create table public.books (
  id uuid primary key default gen_random_uuid(),
  author_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  title text not null check (char_length(title) between 1 and 120),
  description text not null default '' check (char_length(description) <= 2000),
  cover_url text,
  created_at timestamptz not null default now()
);

create table public.chapters (
  id uuid primary key default gen_random_uuid(),
  book_id uuid not null references public.books(id) on delete cascade,
  number int not null check (number between 1 and 1000),
  title text not null check (char_length(title) between 1 and 150),
  content text not null check (char_length(content) <= 100000),
  updated_at timestamptz not null default now(),
  unique (book_id, number)
);

create table public.comments (
  id uuid primary key default gen_random_uuid(),
  chapter_id uuid not null references public.chapters(id) on delete cascade,
  user_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  body text not null check (char_length(body) between 1 and 1000),
  created_at timestamptz not null default now()
);

create table public.reading_progress (
  user_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  book_id uuid not null references public.books(id) on delete cascade,
  chapter_number int not null,
  updated_at timestamptz not null default now(),
  primary key (user_id, book_id)
);

create table public.support_requests (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  topic text not null check (char_length(topic) <= 100),
  message text not null check (char_length(message) between 1 and 2000),
  created_at timestamptz not null default now()
);

create index chapters_book_number_idx on public.chapters (book_id, number);
create index comments_chapter_idx on public.comments (chapter_id, created_at);

-- ============ AUTO-CREATE A PROFILE WHEN SOMEONE SIGNS UP ============

create or replace function public.handle_new_user()
returns trigger
language plpgsql
security definer
set search_path = public
as $$
begin
  insert into public.profiles (id, display_name)
  values (
    new.id,
    coalesce(nullif(left(trim(new.raw_user_meta_data->>'display_name'), 40), ''), 'Reader')
  );
  return new;
end;
$$;

create trigger on_auth_user_created
  after insert on auth.users
  for each row execute function public.handle_new_user();

-- ============ SECURITY RULES (Row Level Security) ============
-- Everyone can read stories. Only the author can change their own book and chapters.
-- Only signed-in users can comment, and only on their own name.

alter table public.profiles         enable row level security;
alter table public.books            enable row level security;
alter table public.chapters         enable row level security;
alter table public.comments         enable row level security;
alter table public.reading_progress enable row level security;
alter table public.support_requests enable row level security;

-- profiles
create policy "Anyone can read profiles" on public.profiles
  for select using (true);
create policy "Users update their own profile" on public.profiles
  for update to authenticated
  using (id = auth.uid()) with check (id = auth.uid());

-- books
create policy "Anyone can read books" on public.books
  for select using (true);
create policy "Signed-in users create their own books" on public.books
  for insert to authenticated with check (author_id = auth.uid());
create policy "Authors update their own books" on public.books
  for update to authenticated
  using (author_id = auth.uid()) with check (author_id = auth.uid());
create policy "Authors delete their own books" on public.books
  for delete to authenticated using (author_id = auth.uid());

-- chapters
create policy "Anyone can read chapters" on public.chapters
  for select using (true);
create policy "Authors add chapters to their books" on public.chapters
  for insert to authenticated
  with check (exists (select 1 from public.books b where b.id = book_id and b.author_id = auth.uid()));
create policy "Authors edit chapters of their books" on public.chapters
  for update to authenticated
  using (exists (select 1 from public.books b where b.id = book_id and b.author_id = auth.uid()))
  with check (exists (select 1 from public.books b where b.id = book_id and b.author_id = auth.uid()));
create policy "Authors delete chapters of their books" on public.chapters
  for delete to authenticated
  using (exists (select 1 from public.books b where b.id = book_id and b.author_id = auth.uid()));

-- comments
create policy "Anyone can read comments" on public.comments
  for select using (true);
create policy "Signed-in users comment as themselves" on public.comments
  for insert to authenticated with check (user_id = auth.uid());
create policy "Users delete their own comments" on public.comments
  for delete to authenticated using (user_id = auth.uid());

-- reading progress (private to each reader)
create policy "Readers see their own progress" on public.reading_progress
  for select to authenticated using (user_id = auth.uid());
create policy "Readers add their own progress" on public.reading_progress
  for insert to authenticated with check (user_id = auth.uid());
create policy "Readers update their own progress" on public.reading_progress
  for update to authenticated
  using (user_id = auth.uid()) with check (user_id = auth.uid());

-- support requests (private: you read them in the Supabase dashboard > Table Editor)
create policy "Users send support requests" on public.support_requests
  for insert to authenticated with check (user_id = auth.uid());
create policy "Users see their own support requests" on public.support_requests
  for select to authenticated using (user_id = auth.uid());

-- ============ BOOK COVER STORAGE ============

insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
values ('covers', 'covers', true, 2097152, array['image/jpeg', 'image/png', 'image/webp'])
on conflict (id) do nothing;

-- Each user can only upload into a folder named after their own user id.
create policy "Users upload covers to their own folder" on storage.objects
  for insert to authenticated
  with check (bucket_id = 'covers' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "Users delete their own covers" on storage.objects
  for delete to authenticated
  using (bucket_id = 'covers' and (storage.foldername(name))[1] = auth.uid()::text);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   STEP 1: paste your two Supabase values here (see README.md)
   The anon / publishable key is SAFE to keep in this file.
   NEVER paste the "service_role" / secret key here.
   ============================================================ */
const SUPABASE_URL = "https://pxjaxwccykehmbntkied.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pqB_u4BxTgt-xMTkCfvOog_rhh3gPk4";

const keysSet = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_ANON_KEY.startsWith("PASTE");
const libOk = typeof supabase !== "undefined";
const configured = keysSet && libOk;
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setupHTML(){
  if(keysSet && !libOk) return '<div class="card"><h3>Could not load the app library</h3><p class="muted">Check your internet connection and reload. If it keeps happening, the Supabase script from cdn.jsdelivr.net is being blocked on your network.</p></div>';
  return `<div class="card">
    <h3>Set up your app</h3>
    <p class="muted" style="margin:0">Do this once. Everything is free.</p>
    <ol class="steps">
      <li>Create a free project at <b>supabase.com</b>.</li>
      <li>Open <b>SQL Editor</b> and tap <b>New query</b>. Tap the button below, paste, then tap <b>Run</b>.</li>
      <li>Open <b>Project Settings &gt; API</b>. Copy the <b>Project URL</b> and the <b>anon (publishable)</b> key. Never use the secret key.</li>
      <li>In this file, find <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script. Paste your two values between the quotation marks and save.</li>
      <li>In Supabase, open <b>Authentication &gt; Sign In / Providers &gt; Email</b> and turn off <b>Confirm email</b> while you test.</li>
      <li>Upload this one file to Netlify Drop, Cloudflare Pages or GitHub Pages. Then paste your new web address into <b>Authentication &gt; URL Configuration &gt; Site URL</b>.</li>
    </ol>
    <button class="btn btn-blue" onclick="copySql()">Copy the SQL</button>
    <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Preview the SQL</summary><pre class="sqlbox" id="sqlBox"></pre></details>
  </div>`;
}
function showSetup(target){
  $(target).innerHTML = setupHTML();
  const box = $('sqlBox'); if(box) box.textContent = $('sqlText').textContent.trim();
}
async function copySql(){
  const text = $('sqlText').textContent.trim();
  try{
    await navigator.clipboard.writeText(text);
    toast('SQL copied. Paste it into the Supabase SQL Editor.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok ? 'SQL copied. Paste it into the Supabase SQL Editor.' : 'Could not copy. Open the preview and copy it by hand.');
  }
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}
function coverHTML(url, title, big){
  const cls = big ? 'coverBig' : 'cover';
  if(url) return `<img class="${cls}" src="${esc(url)}" alt="">`;
  return `<div class="${cls} ph">${esc((title || 'A').trim().charAt(0).toUpperCase())}</div>`;
}

/* ---------------- state ---------------- */
let session = null, profile = null, page = 'explore';
let allBooks = [], openBook = null;
let chapList = [], chapListBook = null;       // published chapters of one book: [{id, number, title}]
const bookCache = {};                          // id -> {title, cover_url}
let rd = {bookId: null, number: null, chapterId: null, tok: 0, loading: false};
let myBooks = [], manageId = null;             // manageId: book id being edited, or 'new'
let autoOn = false, autoInt = null, autoBusy = false;

/* ---------------- navigation ---------------- */
function showPage(p){
  page = p;
  ['explore','library','write','me'].forEach(x => {
    $('page-' + x).style.display = x === p ? 'block' : 'none';
    $('n-' + x).classList.toggle('active', x === p);
  });
  window.scrollTo(0, 0);
  render();
}
function render(){
  if(!db){
    const target = {explore:'exploreBooks', library:'libraryBody', write:'writeGate', me:'meBody'}[page];
    $('bookView').style.display = 'none'; $('exploreList').style.display = 'block';
    $('writeMain').style.display = 'none';
    showSetup(target);
    return;
  }
  if(page === 'explore') openBook ? drawBookView() : renderExplore();
  else if(page === 'library') renderLibrary();
  else if(page === 'write') renderWrite();
  else renderMe();
}
function updateTop(){
  $('who').textContent = session ? (profile?.display_name || 'Reader') : 'Sign in';
}
function requireLogin(){
  if(session) return true;
  closeReader();
  toast('Please sign in first');
  showPage('me');
  return false;
}

/* ---------------- auth ---------------- */
async function loadProfile(){
  profile = null;
  if(!session) return;
  const {data} = await db.from('profiles').select('display_name').eq('id', session.user.id).maybeSingle();
  profile = data;
}
async function signUp(){
  const name = $('authName').value.trim(), email = $('authEmail').value.trim(), password = $('authPass').value;
  if(!name){toast('Enter a display name'); return}
  if(!email){toast('Enter your email'); return}
  if(password.length < 8){toast('Password must be at least 8 characters'); return}
  const {data, error} = await db.auth.signUp({email, password, options: {data: {display_name: name}}});
  if(error){toast(error.message); return}
  if(!data.session) toast('Check your email to confirm your account, then sign in.');
  else toast('Account created');
}
async function signIn(){
  const email = $('authEmail').value.trim(), password = $('authPass').value;
  if(!email || !password){toast('Enter your email and password'); return}
  const {error} = await db.auth.signInWithPassword({email, password});
  if(error) toast(error.message);
}
async function signOut(){ await db.auth.signOut(); toast('Signed out'); }
async function saveName(){
  const name = $('meName').value.trim();
  if(!name){toast('Enter a display name'); return}
  const {error} = await db.from('profiles').update({display_name: name}).eq('id', session.user.id);
  if(error){toast(error.message); return}
  await loadProfile(); updateTop(); toast('Name saved');
}

/* ---------------- explore ---------------- */
async function renderExplore(){
  $('bookView').style.display = 'none'; $('exploreList').style.display = 'block';
  $('exploreBooks').innerHTML = '<div class="muted pad">Loading…</div>';
  const {data, error} = await db.from('books')
    .select('id,title,description,cover_url,created_at,profiles(display_name),chapters(count)')
    .order('created_at', {ascending: false});
  if(error){ $('exploreBooks').innerHTML = `<div class="card">Could not load books: ${esc(error.message)}</div>`; return; }
  allBooks = data || [];
  allBooks.forEach(b => bookCache[b.id] = {title: b.title, cover_url: b.cover_url});
  drawBooks();
}
function drawBooks(){
  const q = $('search').value.trim().toLowerCase();
  const list = allBooks.filter(b => !q || b.title.toLowerCase().includes(q));
  if(!list.length){
    $('exploreBooks').innerHTML = `<div class="card muted">${allBooks.length ? 'No books match your search.' : 'No books yet. Open the Write tab to publish the first one.'}</div>`;
    return;
  }
  $('exploreBooks').innerHTML = '<div class="card">' + list.map(b => {
    const n = b.chapters?.[0]?.count ?? 0;
    return `<div class="row" onclick="showBook('${b.id}')">
      ${coverHTML(b.cover_url, b.title)}
      <div class="grow">
        <div class="t">${esc(b.title)}</div>
        <div class="muted" style="font-size:12px">by ${esc(b.profiles?.display_name || 'Author')} · ${n} chapter${n === 1 ? '' : 's'}</div>
        <div class="d">${esc(b.description)}</div>
      </div></div>`;
  }).join('') + '</div>';
}
async function ensureChapterList(bookId, force){
  if(!force && chapListBook === bookId) return;
  const {data, error} = await db.from('chapters').select('id,number,title').eq('book_id', bookId).order('number');
  chapList = error ? [] : data;
  chapListBook = error ? null : bookId;
}
async function showBook(id){
  const b = allBooks.find(x => x.id === id);
  if(!b) return;
  openBook = b; window.scrollTo(0, 0);
  await ensureChapterList(id, true);
  openBook.progress = null;
  if(session){
    const {data} = await db.from('reading_progress').select('chapter_number').eq('book_id', id).maybeSingle();
    openBook.progress = data ? data.chapter_number : null;
  }
  drawBookView();
}
function drawBookView(){
  const b = openBook;
  $('exploreList').style.display = 'none'; $('bookView').style.display = 'block';
  const first = chapList[0]?.number;
  let action = '';
  if(chapList.length){
    action = b.progress
      ? `<button class="btn btn-blue" onclick="openReader('${b.id}',${b.progress})">Continue chapter ${b.progress}</button>`
      : `<button class="btn btn-blue" onclick="openReader('${b.id}',${first})">Start reading</button>`;
  }
  $('bookView').innerHTML = `
    <div class="card">
      <a onclick="closeBook()" style="font-size:14px">← All books</a>
      <div class="hero" style="margin-top:12px">
        ${coverHTML(b.cover_url, b.title, true)}
        <div style="min-width:0">
          <h2>${esc(b.title)}</h2>
          <div class="muted" style="font-size:13px">by ${esc(b.profiles?.display_name || 'Author')}</div>
          <div class="badge" style="display:inline-block;margin-top:8px">Free to read</div>
        </div>
      </div>
      <p style="font-size:14px;line-height:1.6;white-space:pre-wrap">${esc(b.description)}</p>
      ${action}
    </div>
    <div class="card">
      <b>Chapters (${chapList.length})</b>
      <input id="chapSearch" placeholder="Search chapters" oninput="drawChapterRows()">
      <div id="chapRows"></div>
    </div>`;
  drawChapterRows();
}
function drawChapterRows(){
  const q = ($('chapSearch')?.value || '').trim().toLowerCase();
  const rows = chapList.filter(c => !q || ('chapter ' + c.number).includes(q) || c.title.toLowerCase().includes(q));
  $('chapRows').innerHTML = rows.length
    ? rows.map(c => `<div class="row" onclick="openReader('${openBook.id}',${c.number})"><div class="grow"><b>Ch ${c.number}</b> ${esc(c.title)}</div><span class="badge">Free</span></div>`).join('')
    : '<div class="muted" style="padding:10px 0">No chapters published yet.</div>';
}
function closeBook(){ openBook = null; renderExplore(); }

/* ---------------- reader ---------------- */
function nextNum(){ return chapList.map(c => c.number).find(n => n > rd.number); }
function prevNum(){ return chapList.map(c => c.number).filter(n => n < rd.number).pop(); }
function goNext(){ const n = nextNum(); if(n != null) openReader(rd.bookId, n); }
function goPrev(){ const n = prevNum(); if(n != null) openReader(rd.bookId, n); }

async function openReader(bookId, number){
  const tok = ++rd.tok;
  rd.bookId = bookId; rd.number = number; rd.chapterId = null; rd.loading = true;
  $('reader').style.display = 'block';
  $('rChap').textContent = 'Ch ' + number;
  $('rTitle').textContent = '';
  $('rContent').textContent = 'Loading…';
  $('reader').scrollTop = 0;
  const bc = bookCache[bookId];
  $('rBook').innerHTML = bc ? `${coverHTML(bc.cover_url, bc.title)}<div class="muted" style="font-size:14px">${esc(bc.title)}</div>` : '';
  await ensureChapterList(bookId);
  const {data, error} = await db.from('chapters').select('id,title,content').eq('book_id', bookId).eq('number', number).maybeSingle();
  if(tok !== rd.tok) return;
  rd.loading = false;
  $('prevBtn').disabled = prevNum() == null;
  $('nextBtn').disabled = nextNum() == null;
  if(error || !data){
    $('rTitle').textContent = 'Chapter ' + number;
    $('rContent').textContent = error ? 'Could not load this chapter. Check your connection and try again.' : 'This chapter has not been published yet.';
    $('commentsBox').style.display = 'none';
    return;
  }
  rd.chapterId = data.id;
  $('rTitle').textContent = data.title;
  $('rContent').textContent = data.content;
  $('commentsBox').style.display = 'block';
  loadComments();
  saveProgress();
}
function closeReader(){
  toggleAuto(false);
  $('reader').style.display = 'none';
  rd.tok++;
}
async function saveProgress(){
  if(!session || !rd.chapterId) return;
  await db.from('reading_progress').upsert(
    {user_id: session.user.id, book_id: rd.bookId, chapter_number: rd.number, updated_at: new Date().toISOString()},
    {onConflict: 'user_id,book_id'});
  if(openBook && openBook.id === rd.bookId) openBook.progress = rd.number;
}
async function loadComments(){
  const tok = rd.tok, cid = rd.chapterId;
  const {data} = await db.from('comments').select('id,body,created_at,user_id,profiles(display_name)').eq('chapter_id', cid).order('created_at');
  if(tok !== rd.tok) return;
  $('commentList').innerHTML = (data && data.length)
    ? data.map(c => `<div class="cm"><b>${esc(c.profiles?.display_name || 'Reader')}</b> <span class="muted" style="font-size:11px">${new Date(c.created_at).toLocaleDateString()}</span>${session && c.user_id === session.user.id ? ` <a style="font-size:12px" onclick="delComment('${c.id}')">delete</a>` : ''}<div>${esc(c.body)}</div></div>`).join('')
    : '<small class="muted">No comments yet. Be the first.</small>';
}
async function addComment(){
  if(!requireLogin()) return;
  const body = $('commentInput').value.trim();
  if(!body || !rd.chapterId) return;
  const {error} = await db.from('comments').insert({chapter_id: rd.chapterId, user_id: session.user.id, body});
  if(error){toast(error.message); return}
  $('commentInput').value = '';
  loadComments();
}
async function delComment(id){
  const {error} = await db.from('comments').delete().eq('id', id);
  if(error){toast(error.message); return}
  loadComments();
}

/* ---------------- auto scroll reading ---------------- */
function toggleAuto(force){
  autoOn = typeof force === 'boolean' ? force : !autoOn;
  $('autoLabel').textContent = autoOn ? '⏸ Stop' : '▶ Auto';
  clearInterval(autoInt);
  if(autoOn){
    const r = $('reader');
    autoInt = setInterval(() => {
      if(autoBusy || rd.loading) return;
      r.scrollTop += 2;
      if(r.scrollTop + r.clientHeight >= r.scrollHeight - 8) autoNext();
    }, 40);
  }
}
async function autoNext(){
  autoBusy = true;
  await new Promise(res => setTimeout(res, 1500));
  const r = $('reader');
  if(!autoOn || rd.loading || r.scrollTop + r.clientHeight < r.scrollHeight - 8){ autoBusy = false; return; }
  const n = nextNum();
  if(n == null){ toggleAuto(false); toast('You reached the last chapter'); autoBusy = false; return; }
  await openReader(rd.bookId, n);
  autoBusy = false;
}
async function startAuto(bookId, n){
  await openReader(bookId, n);
  setTimeout(() => toggleAuto(true), 600);
}

/* ---------------- library ---------------- */
async function renderLibrary(){
  if(!session){
    $('libraryBody').innerHTML = '<div class="card"><h3>Your library</h3><p class="muted">Sign in to see the books you are reading and pick up where you stopped.</p><button class="btn btn-blue" onclick="showPage(\'me\')">Sign in</button></div>';
    return;
  }
  $('libraryBody').innerHTML = '<div class="muted pad">Loading…</div>';
  const {data, error} = await db.from('reading_progress')
    .select('chapter_number,updated_at,books(id,title,cover_url)')
    .order('updated_at', {ascending: false});
  if(error){ $('libraryBody').innerHTML = `<div class="card">Could not load your library: ${esc(error.message)}</div>`; return; }
  const rows = (data || []).filter(r => r.books);
  if(!rows.length){
    $('libraryBody').innerHTML = '<div class="card"><h3>Your library</h3><p class="muted">Nothing here yet. Open a book in Explore and start reading.</p></div>';
    return;
  }
  rows.forEach(r => bookCache[r.books.id] = {title: r.books.title, cover_url: r.books.cover_url});
  $('libraryBody').innerHTML = '<div class="card"><b>Continue reading</b>' + rows.map(r => `
    <div class="row" style="cursor:default">
      ${coverHTML(r.books.cover_url, r.books.title)}
      <div class="grow">
        <div class="t">${esc(r.books.title)}</div>
        <div class="muted" style="font-size:12px">Last read: chapter ${r.chapter_number}</div>
        <div class="two"><button class="btn btn-blue" onclick="openReader('${r.books.id}',${r.chapter_number})">Continue</button><button class="btn btn-dark" onclick="startAuto('${r.books.id}',${r.chapter_number})">Auto read</button></div>
      </div>
    </div>`).join('') + '</div>';
}

/* ---------------- write (author) ---------------- */
async function renderWrite(){
  $('writeMain').style.display = 'none';
  if(!session){
    $('writeGate').innerHTML = '<div class="card"><h3>Publish your novel</h3><p class="muted">Create a free account to add your book, cover and chapters. Readers everywhere will see them.</p><button class="btn btn-blue" onclick="showPage(\'me\')">Sign in or create account</button></div>';
    return;
  }
  $('writeGate').innerHTML = '';
  const {data, error} = await db.from('books').select('id,title,description,cover_url').eq('author_id', session.user.id).order('created_at');
  if(error){ $('writeGate').innerHTML = `<div class="card">Could not load your books: ${esc(error.message)}</div>`; return; }
  myBooks = data || [];
  myBooks.forEach(b => bookCache[b.id] = {title: b.title, cover_url: b.cover_url});
  if(manageId !== 'new' && !myBooks.some(b => b.id === manageId)) manageId = myBooks.length ? myBooks[0].id : 'new';
  $('writeMain').style.display = 'block';
  drawMyBooks();
  fillBookForm();
}
function drawMyBooks(){
  $('myBookChips').innerHTML = myBooks.map(b => `<div class="chip ${b.id === manageId ? 'on' : ''}" onclick="selectBook('${b.id}')">${esc(b.title)}</div>`).join('')
    + `<div class="chip ${manageId === 'new' ? 'on' : ''}" onclick="selectBook('new')">+ New book</div>`;
}
function selectBook(id){ manageId = id; drawMyBooks(); fillBookForm(); }
function fillBookForm(){
  const isNew = manageId === 'new';
  const b = isNew ? null : myBooks.find(x => x.id === manageId);
  $('bookFormTitle').textContent = isNew ? 'New book' : 'Book details';
  $('bfSave').textContent = isNew ? 'Create book' : 'Save details';
  $('bfTitle').value = b ? b.title : '';
  $('bfDesc').value = b ? b.description : '';
  $('bfCover').value = '';
  $('bfCoverWrap').innerHTML = coverHTML(b?.cover_url, b?.title || 'A', true);
  $('chapterEditor').style.display = isNew ? 'none' : 'block';
  $('chapterListCard').style.display = isNew ? 'none' : 'block';
  if(!isNew){
    $('chNum').value = 1;
    loadEditorChapter();
    loadMyChapters();
  }
}
function previewCover(){
  const f = $('bfCover').files[0];
  if(!f) return;
  $('bfCoverWrap').innerHTML = `<img class="coverBig" src="${URL.createObjectURL(f)}" alt="">`;
}
async function uploadCover(file){
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Use a JPG, PNG or WebP image'); return false}
  if(file.size > 2 * 1024 * 1024){toast('Cover is bigger than 2 MB. Pick a smaller image.'); return false}
  const ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
  const path = `${session.user.id}/${Date.now()}.${ext}`;
  const {error} = await db.storage.from('covers').upload(path, file, {contentType: file.type, cacheControl: '3600'});
  if(error){toast('Cover upload failed: ' + error.message); return false}
  return db.storage.from('covers').getPublicUrl(path).data.publicUrl;
}
async function saveBook(){
  if(!requireLogin()) return;
  const title = $('bfTitle').value.trim(), description = $('bfDesc').value.trim();
  if(!title){toast('Give your book a title'); return}
  $('bfSave').disabled = true;
  try{
    let coverUrl = null;
    const file = $('bfCover').files[0];
    if(file){ coverUrl = await uploadCover(file); if(coverUrl === false) return; }
    if(manageId === 'new'){
      const {data, error} = await db.from('books').insert({author_id: session.user.id, title, description, cover_url: coverUrl}).select('id').single();
      if(error){toast(error.message); return}
      manageId = data.id;
      toast('Book created. Now write chapter 1.');
    } else {
      const patch = {title, description};
      if(coverUrl) patch.cover_url = coverUrl;
      const {error} = await db.from('books').update(patch).eq('id', manageId);
      if(error){toast(error.message); return}
      toast('Details saved');
    }
    await renderWrite();
  } finally { $('bfSave').disabled = false; }
}
async function loadEditorChapter(){
  const n = parseInt($('chNum').value, 10);
  if(!n || n < 1 || n > 1000){ return; }
  const {data} = await db.from('chapters').select('title,content').eq('book_id', manageId).eq('number', n).maybeSingle();
  if(parseInt($('chNum').value, 10) !== n) return;
  $('chTitle').value = data ? data.title : 'Chapter ' + n;
  $('chContent').value = data ? data.content : '';
}
async function publishChapter(){
  if(!requireLogin()) return;
  const n = parseInt($('chNum').value, 10);
  const title = $('chTitle').value.trim(), content = $('chContent').value;
  if(!n || n < 1 || n > 1000){toast('Chapter number must be between 1 and 1000'); return}
  if(!title){toast('Give the chapter a title'); return}
  if(!content.trim()){toast('Write something first'); return}
  $('chPublish').disabled = true;
  const {error} = await db.from('chapters').upsert(
    {book_id: manageId, number: n, title, content, updated_at: new Date().toISOString()},
    {onConflict: 'book_id,number'});
  $('chPublish').disabled = false;
  if(error){toast(error.message); return}
  chapListBook = null;
  toast('Chapter ' + n + ' published');
  loadMyChapters();
}
function nextChapter(){
  const n = (parseInt($('chNum').value, 10) || 0) + 1;
  if(n > 1000) return;
  $('chNum').value = n;
  loadEditorChapter();
}
async function loadMyChapters(){
  const id = manageId;
  const {data} = await db.from('chapters').select('number,title').eq('book_id', id).order('number');
  if(id !== manageId) return;
  $('myChapters').innerHTML = (data && data.length)
    ? data.map(c => `<div class="row" style="cursor:default"><div class="grow"><b>Ch ${c.number}</b> ${esc(c.title)}</div><a onclick="editChapter(${c.number})">Edit</a><a style="color:var(--red)" onclick="deleteChapter(${c.number})">Delete</a></div>`).join('')
    : '<div class="muted" style="padding:10px 0">No chapters yet. Publish your first one above.</div>';
}
function editChapter(n){
  $('chNum').value = n;
  loadEditorChapter();
  $('chapterEditor').scrollIntoView({behavior: 'smooth'});
}
async function deleteChapter(n){
  if(!confirm('Delete chapter ' + n + '? This cannot be undone.')) return;
  const {error} = await db.from('chapters').delete().eq('book_id', manageId).eq('number', n);
  if(error){toast(error.message); return}
  chapListBook = null;
  toast('Chapter ' + n + ' deleted');
  loadMyChapters();
}

/* ---------------- me ---------------- */
function renderMe(){
  if(!session){
    $('meBody').innerHTML = `<div class="card">
      <h3>Welcome to Axis</h3>
      <p class="muted" style="margin:0">Sign in to comment, save your place and publish your own novel.</p>
      <input id="authName" placeholder="Display name (new accounts only)" maxlength="40" autocomplete="nickname">
      <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="authPass" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
      <div class="two"><button class="btn btn-blue" onclick="signIn()">Sign in</button><button class="btn btn-dark" onclick="signUp()">Create account</button></div>
    </div>`;
    return;
  }
  $('meBody').innerHTML = `
    <div class="card">
      <b>Account</b>
      <p class="muted" style="margin:6px 0 0">${esc(session.user.email)}</p>
      <input id="meName" value="${esc(profile?.display_name || '')}" maxlength="40" placeholder="Display name">
      <div class="two"><button class="btn btn-blue" onclick="saveName()">Save name</button><button class="btn btn-dark" onclick="signOut()">Sign out</button></div>
    </div>
    <div class="card">
      <b>Help and support</b>
      <select id="aidType"><option>Chapter not opening</option><option>Book cover problem</option><option>Publishing help</option><option>Account problem</option><option>Other</option></select>
      <textarea id="aidMsg" placeholder="Describe the problem" style="min-height:90px" maxlength="2000"></textarea>
      <button class="btn btn-blue" onclick="sendHelp()">Send request</button>
    </div>
    <div class="card">
      <b>Coins, tips and payouts</b>
      <p class="muted" style="margin:6px 0 0">Not available yet. Real payments come in the next stage, so no balance or withdrawal is shown here.</p>
    </div>`;
}
async function sendHelp(){
  const topic = $('aidType').value, message = $('aidMsg').value.trim();
  if(!message){toast('Describe the problem first'); return}
  const {error} = await db.from('support_requests').insert({user_id: session.user.id, topic, message});
  if(error){toast(error.message); return}
  $('aidMsg').value = '';
  toast('Request sent');
}

/* ---------------- start ---------------- */
async function init(){
  if(!db){ render(); return; }
  const {data} = await db.auth.getSession();
  session = data.session;
  await loadProfile();
  updateTop();
  db.auth.onAuthStateChange((event, s) => {
    session = s;
    if(event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') return;
    setTimeout(async () => {          // avoid calling Supabase inside the callback itself
      await loadProfile();
      updateTop();
      if(!session){ myBooks = []; manageId = null; openBook = null; }
      render();
    }, 0);
  });
  render();
}
init();
</script>
